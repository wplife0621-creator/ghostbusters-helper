</head>
<body>
  <header class="topbar compact">
    <div class="topbar-inner">
      <h1>미궁 시간 계산기</h1>
      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="./index.html">홈</a>
        <details class="nav-dropdown">
          <summary>도감</summary>
          <div class="nav-submenu">
            <a href="./essences.html">정수</a>
            <a href="./numbers.html">넘버스</a>
          </div>
        </details>
        <a href="./builds.html">빌드</a>
        <a href="./guides.html">게시판</a>
        <a href="./spec-qa.html">스펙 질문</a>
        <a href="./report.html">정보 제보/수정</a>
        <a href="./maze-time.html" aria-current="page">미궁 시간 계산기</a>
        <a href="./maze-log.html">미궁 일지</a>
      </nav>
    </div>
  </header>
  <main class="layout calculator-layout">
    <section class="panel page-intro">
      <p class="home-kicker">MAZE TIMER</p>
      <h2>미궁 시간과 컨디션 계산</h2>
      <p>게임 일, 게임 시간, 현재 컨디션을 입력하면 미궁 진행에 필요한 현실 시간과 필요 컨디션, 진행 후 남는 컨디션을 계산합니다. 미궁 진입 전 계획을 세울 때 사용할 수 있습니다.</p>
    </section>
    <section class="panel maze-calculator">
      <div class="section-title compact-title">
        <h2>게임 진행 시간</h2>
      </div>
      <div class="maze-inputs">
        <label class="field">
          <span>게임 일</span>
          <input id="gameDays" type="number" min="0" step="1" value="1">
        </label>
        <label class="field">
          <span>게임 시간</span>
          <input id="gameHours" type="number" min="0" step="1" value="0">
        </label>
        <label class="field">
          <span>현재 컨디션</span>
          <input id="currentCondition" type="number" min="0" max="100" step="1" value="100">
        </label>
      </div>
      <div class="maze-results">
        <div class="calc-result" id="timeResult"></div>
        <div class="condition-result">
          <span>필요 컨디션</span>
          <strong id="neededCondition">0</strong>
          <small id="conditionGuide"></small>
        </div>
        <div class="condition-result remaining">
          <span>진행 후 컨디션</span>
          <strong id="remainingCondition">100</strong>
          <small>컨디션은 0 미만으로 내려가지 않습니다.</small>
        </div>
      </div>
    </section>
  </main>
  <script src="./config.js?v=20260607-spec-qa"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="./firebase-bridge.js?v=20260606-legacy-data-fallback"></script>
  <script src="./auth.js?v=20260607-firebase-nickname-fix"></script>
  <script src="./app.js?v=20260608-spec-qa-launch"></script>
</body>
</html>
