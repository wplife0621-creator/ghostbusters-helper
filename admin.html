  <main class="layout report-layout admin-review-layout">
    <section class="panel report-panel page-panel admin-gate">
      <div class="section-title compact-title">
        <h2>관리자 전용 검수</h2>
        <p>등록 대기 중인 정수와 넘버스 제보를 승인하거나 반려할 수 있습니다.</p>
      </div>
      <div class="admin-row">
        <button id="adminUnlock" class="submit-report" type="button">Google 관리자 로그인</button>
        <button id="adminLock" type="button" hidden>로그아웃</button>
      </div>
      <p id="adminStatus" class="admin-status">관리자 권한을 확인하는 중입니다.</p>
      <p id="reportSyncStatus" class="build-sync-status"></p>
    </section>

    <section class="panel report-panel page-panel admin-review-section">
      <div class="review-head">
        <strong id="pendingCount">검수 대기 0건</strong>
        <button id="copyApproved" type="button" hidden>승인 데이터 복사</button>
      </div>
      <div id="pendingReports" class="pending-reports"></div>
    </section>

    <section class="panel report-panel page-panel admin-review-section">
      <div class="review-head">
        <strong id="approvedCount">등록된 정보 0건</strong>
      </div>
      <div id="approvedReports" class="pending-reports"></div>
    </section>
