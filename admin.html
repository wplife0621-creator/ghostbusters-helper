<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 센터 · 덕후버스터즈</title>
  <link rel="stylesheet" href="./styles.css?v=20260601-admin-compact">
</head>
<body class="admin-review-page">
  <header class="topbar compact">
    <div class="topbar-inner">
      <h1>관리자 센터</h1>
      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="./index.html">홈</a>
        <details class="nav-dropdown">
          <summary>도감</summary>
          <div class="nav-submenu">
            <a href="./essences.html">정수</a>
            <a href="./numbers.html">넘버스</a>
          </div>
        </details>
        <a href="./builds.html">나만의 빌드</a>
        <a href="./guides.html">공략글</a>
        <a href="./report.html">정보 제보/수정</a>
        <a href="./maze-time.html">미궁 시간 계산기</a>
      </nav>
    </div>
  </header>

  <main class="layout report-layout admin-review-layout admin-center-layout">
    <section class="panel report-panel page-panel admin-gate admin-center-hero">
      <div class="section-title compact-title">
        <h2>관리자 전용 운영실</h2>
        <p>제보 검수, 공략글, 댓글, 빌드, 사용자 닉네임, 방문 통계와 백업을 한 곳에서 확인합니다.</p>
      </div>
      <div class="admin-row">
        <button id="adminUnlock" class="submit-report" type="button">Google 관리자 로그인</button>
        <button id="adminLock" type="button" hidden>로그아웃</button>
      </div>
      <p id="adminStatus" class="admin-status">관리자 권한을 확인하는 중입니다.</p>
      <p id="reportSyncStatus" class="build-sync-status"></p>
    </section>

    <section class="panel report-panel page-panel admin-review-section admin-dashboard">
      <div class="section-title compact-title">
        <h2>운영 현황</h2>
        <p>지금 손봐야 할 항목을 빠르게 확인합니다.</p>
      </div>
      <div id="adminStatsGrid" class="admin-stats-grid"></div>
      <div class="admin-quick-actions">
        <a href="./report.html">정보 제보/수정 열기</a>
        <a href="./guides.html">공략 게시판 열기</a>
        <a href="./builds.html">나만의 빌드 열기</a>
      </div>
    </section>

    <section id="admin-pending" class="panel report-panel page-panel admin-review-section">
      <div class="review-head">
        <strong id="pendingCount">검수 대기 0건</strong>
        <button id="copyApproved" type="button" hidden>승인 데이터 복사</button>
      </div>
      <div id="pendingReports" class="pending-reports"></div>
    </section>

    <section id="admin-approved" class="panel report-panel page-panel admin-review-section">
      <div class="review-head">
        <strong id="approvedCount">등록된 정보 0건</strong>
      </div>
      <div id="approvedReports" class="pending-reports"></div>
    </section>

    <section id="admin-guides" class="panel report-panel page-panel admin-review-section">
      <div class="review-head">
        <strong id="adminGuideCount">공략글/댓글 0건</strong>
        <button id="adminRefreshCenter" type="button">새로고침</button>
      </div>
      <div id="adminGuideList" class="admin-management-list"></div>
    </section>

    <section id="admin-builds" class="panel report-panel page-panel admin-review-section">
      <div class="review-head">
        <strong id="adminBuildCount">공개 빌드 0건</strong>
      </div>
      <div id="adminBuildList" class="admin-management-list"></div>
    </section>

    <section id="admin-users" class="panel report-panel page-panel admin-review-section">
      <div class="review-head">
        <strong id="adminUserCount">사용자 닉네임 0명</strong>
      </div>
      <div id="adminUserList" class="admin-management-list"></div>
    </section>

    <section class="panel report-panel page-panel admin-review-section admin-ops-grid">
      <div>
        <div id="admin-stats" class="review-head">
          <strong>사이트 통계</strong>
        </div>
        <div id="adminSiteStats" class="admin-management-list"></div>
      </div>
      <div>
        <div id="admin-quality" class="review-head">
          <strong>품질 점검</strong>
        </div>
        <div id="adminQualityList" class="admin-management-list"></div>
      </div>
    </section>

    <section id="admin-backup" class="panel report-panel page-panel admin-review-section">
      <div class="review-head">
        <strong>데이터 백업</strong>
      </div>
      <div class="admin-backup-grid">
        <button id="adminExportReports" type="button">정수/넘버스 백업</button>
        <button id="adminExportGuides" type="button">공략글 백업</button>
        <button id="adminExportBuilds" type="button">빌드 백업</button>
        <button id="adminExportAll" type="button">전체 백업</button>
      </div>
    </section>
  </main>

  <script src="./ghost-data.js?v=20260520"></script>
  <script>
    window.DUKHUBUSTERS_CONFIG = window.DUKHUBUSTERS_CONFIG || {
      supabaseUrl: "",
      supabaseAnonKey: "",
      buildTable: "builds",
      reportTable: "monster_reports",
      adminEmails: [],
    };
  </script>
  <script src="./config.js?v=20260601-nickname-check"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./auth.js?v=20260601-nickname-check"></script>
  <script src="./app.js?v=20260601-build-rename"></script>
</body>
</html>
