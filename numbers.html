  <link rel="stylesheet" href="./styles.css?v=20260602-adsense-ready">
  <meta name="naver-site-verification" content="d128dcbe8c036b698098881ea9336cf3236fe12a">

</head>
<body>
  <header class="topbar compact">
    <div class="topbar-inner">
      <h1>넘버스</h1>
      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="./index.html">홈</a>
        <details class="nav-dropdown">
          <summary aria-current="page">도감</summary>
          <div class="nav-submenu">
            <a href="./essences.html">정수</a>
            <a href="./numbers.html" aria-current="page">넘버스</a>
          </div>
        </details>
        <a href="./builds.html">빌드</a>
        <a href="./guides.html">게시판</a>
        <a href="./report.html">정보 제보/수정</a>
        <a href="./maze-time.html">미궁 시간 계산기</a>
      </nav>
    </div>
  </header>

  <main class="layout numbers-layout">
    <section class="panel page-intro">
      <p class="home-kicker">NUMBERS CODEX</p>
      <h2>넘버스 정보 도감</h2>
      <p>넘버스의 번호, 이름, 착용부위, 효과, 아이템 레벨과 획득처를 한곳에서 확인합니다. 번호가 미확인인 항목도 따로 표시하고, 층·구역·효과별 정렬로 필요한 넘버스를 빠르게 찾을 수 있습니다.</p>
    </section>
    <section class="panel numbers-panel">
      <div class="section-title compact-title">
        <h2>넘버스 정보</h2>
        <p>번호, 이름, 효과, 착용부위, 획득처와 아이템 레벨을 확인하세요.</p>
      </div>
      <div class="numbers-controls">
        <label class="field wide">
          <span>검색</span>
          <input id="numbersSearch" type="search" placeholder="이름, 번호, 효과, 착용부위, 획득처 검색">
        </label>
        <label class="field">
          <span>층</span>
          <select id="numbersFloor"></select>
        </label>
        <label class="field">
          <span>구역</span>
          <select id="numbersArea"></select>
        </label>
        <label class="field">
          <span>아이템 레벨</span>
          <select id="numbersLevel"></select>
        </label>
        <label class="field">
          <span>정렬</span>
          <select id="numbersSort">
            <option value="number">번호 순</option>
            <option value="level-desc">레벨 높은 순</option>
            <option value="level-asc">레벨 낮은 순</option>
          </select>
        </label>
      </div>
    </section>

    <section class="panel effect-panel numbers-effect-panel">
      <div class="section-title compact-title">
        <h2>효과 정렬</h2>
        <p id="numbersEffectSortSummary">원하는 효과를 누르면 해당 넘버스가 먼저 표시됩니다.</p>
      </div>
      <div id="numbersEffectSortChips" class="effect-chip-row" aria-label="넘버스 효과 정렬 선택"></div>
    </section>

    <section class="panel numbers-panel">
      <div class="section-title compact-title">
        <h2>목록</h2>
        <p id="numbersCount">0건</p>
      </div>
      <div id="numbersResults"></div>
      <div id="numbersPagination" class="numbers-pagination" aria-label="넘버스 목록 페이지"></div>
    </section>
  </main>

  <script src="./ghost-data.js?v=20260520"></script>

  <script src="./auth.js?v=20260602-encoding-fix"></script>
  <script src="./app.js?v=20260603-numbers-restore"></script>
</body>
</html>
