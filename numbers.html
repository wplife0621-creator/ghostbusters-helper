</head>
<body>

    <div class="topbar-inner">
      <h1>넘버스</h1>
      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="./index.html">홈</a>
        <details class="nav-dropdown">
          <summary aria-current="page">도감</summary>
          <div class="nav-submenu">

  <main class="layout numbers-layout">
    <section class="panel page-intro">
      <p class="home-kicker">NUMBERS CODEX</p>
      <h2>넘버스 정보 도감</h2>
      <p>넘버스의 번호, 이름, 착용부위, 효과, 아이템 레벨과 획득처를 한곳에서 확인합니다. 번호가 미확인인 항목도 따로 표시하고, 층·구역·효과별 정렬로 필요한 넘버스를 빠르게 찾을 수 있습니다.</p>
    </section>
    <section class="panel numbers-panel">
      <div class="section-title compact-title">
        <h2>넘버스 정보</h2>
        <p>번호, 이름, 효과, 착용부위, 획득처와 아이템 레벨을 확인하세요.</p>
      </div>
      <div class="numbers-controls">
        <label class="field wide">
          <span>검색</span>
          <input id="numbersSearch" type="search" placeholder="이름, 번호, 효과, 착용부위, 획득처 검색">
        </label>
        <label class="field">
          <span>층</span>
          <select id="numbersFloor"></select>
        </label>
        <label class="field">
          <span>구역</span>
          <select id="numbersArea"></select>
        </label>
        <label class="field">
          <span>아이템 레벨</span>
          <select id="numbersLevel"></select>
        </label>
        <label class="field">
          <span>정렬</span>
          <select id="numbersSort">
            <option value="number">번호 순</option>
            <option value="level-desc">레벨 높은 순</option>
            <option value="level-asc">레벨 낮은 순</option>
          </select>
        </label>
      </div>
    </section>

    <section class="panel effect-panel numbers-effect-panel">
      <div class="section-title compact-title">
        <h2>효과 정렬</h2>
        <p id="numbersEffectSortSummary">원하는 효과를 누르면 해당 넘버스가 먼저 표시됩니다.</p>
      </div>
      <div id="numbersEffectSortChips" class="effect-chip-row" aria-label="넘버스 효과 정렬 선택"></div>
    </section>

    <section class="panel numbers-panel">
      <div class="section-title compact-title">
        <h2>목록</h2>
        <p id="numbersCount">0건</p>
      </div>
      <div id="numbersResults"></div>
      <div id="numbersPagination" class="numbers-pagination" aria-label="넘버스 목록 페이지"></div>
    </section>
  </main>

  <script src="./ghost-data.js?v=20260520"></script>
  <script>
    window.DUKHUBUSTERS_CONFIG = window.DUKHUBUSTERS_CONFIG || {
      supabaseUrl: "",
      supabaseAnonKey: "",
      buildTable: "builds",
      reportTable: "monster_reports",
      visitorTable: "site_visitors",
      dailyVisitorTable: "daily_visitors",
    };
  </script>
  <script src="./config.js?v=20260607-spec-qa"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="./firebase-bridge.js?v=20260606-legacy-data-fallback"></script>
  <script src="./auth.js?v=20260607-firebase-nickname-fix"></script>
  <script src="./app.js?v=20260607-delete-apply-fix"></script>
  <script>
    (function () {
      function text(value) {
        return String(value == null ? "" : value).trim();
      }

      function escapeHtml(value) {
        return text(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function displayNumber(value) {
        var number = text(value);
        return number && number !== "미확인" ? "NO." + number : "NO.미확인";
      }

      function renderNumbersFallback() {
        var data = (window.GHOST_DATA && window.GHOST_DATA["넘버스"]) || [];
        var results = document.getElementById("numbersResults");
        var count = document.getElementById("numbersCount");
        var search = document.getElementById("numbersSearch");
        if (!results || !data.length) return;
        var rendered = text(results.textContent);
        if (rendered && rendered !== "조건에 맞는 넘버스 정보가 없습니다.") return;

        function draw() {
          var query = text(search && search.value).toLowerCase();
          var rows = data.filter(function (row) {
            if (!query) return true;
            return [row["번호"], row["이름"], row["효과"], row["아이템 레벨(Lv)"], row["착용부위"], row["획득처"]].some(function (value) {
              return text(value).toLowerCase().indexOf(query) >= 0;
            });
          });
          if (count) count.textContent = "총 " + rows.length + "건";
          results.innerHTML = rows.length ? '<div class="numbers-card-list">' + rows.map(function (row) {
            return '<article class="number-card"><div class="number-card-head"><div class="number-title-line"><span class="number-code">' + escapeHtml(displayNumber(row["번호"])) + '</span><strong>' + escapeHtml(row["이름"] || "이름 미확인") + '</strong></div><span class="grade-pill">Lv ' + escapeHtml(row["아이템 레벨(Lv)"] || "미확인") + '</span></div><div class="number-card-meta"><span><b>착용부위</b>' + escapeHtml(row["착용부위"] || "-") + '</span></div><div class="number-card-meta number-source-block"><b>획득처</b><p>' + escapeHtml(row["획득처"] || "-") + '</p></div><div class="number-card-meta number-effect-block"><b>효과</b><p>' + escapeHtml(row["효과"] || "-") + '</p></div></article>';
          }).join("") + '</div>' : '<div class="empty">조건에 맞는 넘버스 정보가 없습니다.</div>';
        }

        draw();
        if (search && !search.dataset.fallbackBound) {
          search.dataset.fallbackBound = "1";
          search.addEventListener("input", draw);
        }
      }

      window.addEventListener("load", function () {
        setTimeout(renderNumbersFallback, 1200);
      });
    }());
  </script>
</body>
</html>
