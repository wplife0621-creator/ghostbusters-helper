name: Refresh static public data

on:
  schedule:
    # Daily at 03:10 KST. GitHub Actions cron uses UTC.
    - cron: "10 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-static-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate static data
        run: node scripts/generate-static-data.js

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data config.js; then
            echo "No static data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data config.js
          git commit -m "Refresh static public data"
          git push
