name: Refresh static public data

on:
  workflow_dispatch:
    inputs:
      confirm_firestore_read:
        description: "Type FIRESTORE_READ to intentionally refresh static data from Firestore."
        required: true
        default: ""

permissions:
  contents: write

jobs:
  refresh-static-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Guard Firestore reads
        run: |
          if [ "${{ github.event.inputs.confirm_firestore_read }}" != "FIRESTORE_READ" ]; then
            echo "Firestore refresh is disabled for static-only operations."
            echo "Use the site data JSON files and ghost-data.js as the source of truth."
            exit 0
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate static data
        run: node scripts/generate-static-data.js

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data config.js; then
            echo "No static data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data config.js
          git commit -m "Refresh static public data"
          git push
