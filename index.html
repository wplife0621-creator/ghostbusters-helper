<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>덕후버스터즈</title>
  <link rel="stylesheet" href="./styles.css?v=20260520-3">
</head>
<body>
  <header class="topbar compact">
    <h1>덕후버스터즈</h1>
  </header>

  <main class="layout compact-layout">
    <section class="tool-strip">
      <article class="panel calculator compact-card">
        <div class="section-title">
          <h2>시간 계산기</h2>
        </div>
        <div class="calc-row">
          <label class="field">
            <span>게임 일</span>
            <input id="gameDays" type="number" min="0" step="1" value="1">
          </label>
          <label class="field">
            <span>게임 시간</span>
            <input id="gameHours" type="number" min="0" step="1" value="0">
          </label>
        </div>
        <div class="calc-result" id="timeResult"></div>
      </article>

      <section class="panel controls compact-card">
        <label class="field wide">
          <span>정수 검색</span>
          <input id="searchInput" type="search" placeholder="몬스터, 스탯, 패시브, 액티브 검색">
        </label>
        <label class="field">
          <span>층</span>
          <select id="floorFilter"></select>
        </label>
        <label class="field">
          <span>구역</span>
          <select id="areaFilter"></select>
        </label>
        <label class="field">
          <span>추천 캐릭터</span>
          <select id="characterFilter"></select>
        </label>
        <label class="field">
          <span>정렬</span>
          <select id="sortFilter">
            <option value="default">층/구역순</option>
            <option value="grade">등급 우선</option>
            <option value="cooldown">쿨타임 짧은 순</option>
          </select>
        </label>
        <label class="field">
          <span>스탯 선택</span>
          <select id="statSortFilter"></select>
        </label>
      </section>
    </section>

    <section class="panel stat-panel">
      <div class="section-title compact-title">
        <h2>스탯 정렬</h2>
        <p id="statSortSummary">스탯을 누르면 높은 순으로 정렬됩니다.</p>
      </div>
      <div id="statChips" class="stat-chip-row"></div>
    </section>

    <section class="panel report-panel">
      <div class="section-title compact-title">
        <h2>정보 제보</h2>
        <p>검수 후 승인하면 이 브라우저의 정수 목록에 추가됩니다.</p>
      </div>
      <form id="reportForm" class="report-form">
        <label class="field">
          <span>몬스터명</span>
          <input id="reportMonster" required placeholder="예: 얼음 와이번">
        </label>
        <label class="field">
          <span>등급</span>
          <input id="reportGrade" required placeholder="예: 6등급">
        </label>
        <label class="field">
          <span>층</span>
          <input id="reportFloor" required placeholder="예: 5층">
        </label>
        <label class="field">
          <span>구역</span>
          <input id="reportArea" required placeholder="예: 서리 협곡">
        </label>
        <label class="field wide">
          <span>스탯</span>
          <input id="reportStats" required placeholder="예: 근력 32, 민첩 26, 냉기저항 32">
        </label>
        <label class="field wide">
          <span>패시브</span>
          <input id="reportPassive" required placeholder="예: 동상: 공격 시 빙결 스택 부여">
        </label>
        <label class="field wide">
          <span>액티브</span>
          <input id="reportActive" required placeholder="예: 냉기 폭발(25s): 냉기 폭발 + 둔화">
        </label>
        <button class="submit-report" type="submit">제보 등록</button>
      </form>
      <div class="review-head">
        <strong id="pendingCount">검수 대기 0건</strong>
        <button id="copyApproved" type="button">승인 데이터 복사</button>
      </div>
      <div id="pendingReports" class="pending-reports"></div>
    </section>

    <section class="panel results-panel">
      <div class="section-title compact-title">
        <h2 id="resultTitle">정수 목록</h2>
        <p id="resultCount">0건</p>
      </div>
      <div id="results" class="essence-results"></div>
    </section>
  </main>

  <script src="./ghost-data.js?v=20260520"></script>
  <script src="./app.js?v=20260520-11"></script>
</body>
</html>
