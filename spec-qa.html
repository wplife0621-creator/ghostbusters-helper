<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>스펙 질문 · 겜바바 버스터즈</title>
  <meta name="description" content="겜바바 팬게임 몬스터별 필요 스펙을 질문하고 답변하는 전용 Q&A 게시판입니다.">
  <link rel="stylesheet" href="./styles.css?v=20260608-spec-delete">
  <meta name="naver-site-verification" content="d128dcbe8c036b698098881ea9336cf3236fe12a">
</head>
<body>
  <header class="topbar compact">
    <div class="topbar-inner">
      <h1>스펙 질문</h1>
      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="./index.html">홈</a>
        <details class="nav-dropdown">
          <summary>도감</summary>
          <div class="nav-submenu">
            <a href="./essences.html">정수</a>
            <a href="./numbers.html">넘버스</a>
          </div>
        </details>
        <a href="./builds.html">빌드</a>
        <a href="./guides.html">게시판</a>
        <a href="./spec-qa.html" aria-current="page">스펙 질문</a>
        <a href="./report.html">정보 제보/수정</a>
        <a href="./maze-time.html">미궁 시간 계산기</a>
        <a href="./maze-log.html">미궁 일지</a>
      </nav>
    </div>
  </header>

  <main class="layout spec-layout">
    <section class="panel page-intro spec-hero">
      <p class="home-kicker">SPEC Q&A</p>
      <h2>한 줄로 묻고, 답변으로 쌓는 스펙 질문</h2>
      <p>몬스터만 고르면 질문은 끝입니다. 질문을 누르면 답변과 좋아요를 확인할 수 있습니다.</p>
    </section>

    <section class="panel spec-board">
      <div class="spec-board-head">
        <button id="openSpecQuestion" class="submit-report spec-ask-button" type="button">스펙 물어보기</button>
        <p id="specStatus" class="build-sync-status"></p>
      </div>
      <div class="guide-toolbar spec-toolbar">
        <label class="guide-search">
          <span>검색</span>
          <input id="specSearch" type="search" placeholder="몬스터 검색">
        </label>
        <select id="specMonsterFilter" aria-label="몬스터 필터">
          <option value="">전체 몬스터</option>
        </select>
        <p id="specCount">질문 0개</p>
      </div>
      <div id="specQuestionList" class="spec-question-list"></div>
      <nav id="specPagination" class="guide-pagination" aria-label="스펙 질문 페이지"></nav>
    </section>
  </main>

  <div id="specQuestionModal" class="build-form-modal spec-question-modal" hidden>
    <section class="build-form-dialog spec-question-dialog" role="dialog" aria-modal="true" aria-labelledby="specQuestionTitle">
      <div class="build-form-head">
        <div>
          <p class="home-kicker">SPEC ASK</p>
          <h2 id="specQuestionTitle">스펙 물어보기</h2>
          <span>몬스터만 입력하면 질문이 등록됩니다.</span>
        </div>
        <button id="closeSpecQuestion" class="build-form-close" type="button" aria-label="닫기">×</button>
      </div>
      <form id="specQuestionForm" class="spec-simple-form">
        <label class="field">
          <span>몬스터</span>
          <input id="specMonster" list="specMonsterOptions" required placeholder="예: 데스웜">
          <datalist id="specMonsterOptions"></datalist>
        </label>
        <button class="submit-report" type="submit">질문 등록</button>
      </form>
    </section>
  </div>

  <script src="./ghost-data.js?v=20260520"></script>
  <script>
    window.DUKHUBUSTERS_CONFIG = window.DUKHUBUSTERS_CONFIG || {
      supabaseUrl: "",
      supabaseAnonKey: "",
      specQuestionTable: "spec_questions",
    };
  </script>
  <script src="./config.js?v=20260607-spec-qa"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="./firebase-bridge.js?v=20260607-spec-qa"></script>
  <script src="./auth.js?v=20260607-firebase-nickname-fix"></script>
  <script src="./spec-qa.js?v=20260608-spec-delete"></script>
</body>
</html>
