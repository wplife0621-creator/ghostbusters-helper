<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>빌드 공유 · 덕후버스터즈</title>
  <link rel="stylesheet" href="./styles.css?v=20260522-5">
</head>
<body>
  <header class="topbar compact">
    <div class="topbar-inner">
      <h1>빌드 공유</h1>
      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="./index.html">홈</a>
        <a href="./builds.html" aria-current="page">빌드 공유</a>
        <a href="./report.html">정보 제보/수정</a>
      </nav>
    </div>
  </header>

  <main class="layout build-layout">
    <section class="panel build-panel page-panel">
      <div class="section-title compact-title">
        <h2>빌드 등록</h2>
        <p>캐릭터를 1명부터 5명까지 넣고, 각 캐릭터 레벨만큼 정수를 선택하거나 직접 입력할 수 있습니다.</p>
      </div>
      <form id="buildForm" class="build-form">
        <label class="field">
          <span>빌드명</span>
          <input id="buildTitle" required placeholder="예: 비요른 초반 탱커 빌드">
        </label>
        <label class="field">
          <span>작성자</span>
          <input id="buildAuthor" placeholder="닉네임">
        </label>
        <label class="field">
          <span>캐릭터 수</span>
          <select id="buildCharacterCount">
            <option value="1">1명</option>
            <option value="2">2명</option>
            <option value="3">3명</option>
            <option value="4">4명</option>
            <option value="5">5명</option>
          </select>
        </label>
        <datalist id="buildEssenceOptions"></datalist>
        <div id="buildCharacterSlots" class="build-character-slots"></div>
        <label class="field build-note">
          <span>설명</span>
          <textarea id="buildNote" rows="3" placeholder="운용 팁, 장점, 대체 정수 등을 적어주세요."></textarea>
        </label>
        <button class="submit-report" type="submit">빌드 등록</button>
      </form>
    </section>

    <section class="panel build-panel page-panel">
      <div class="review-head">
        <strong id="buildCount">등록된 빌드 0개</strong>
        <button id="copyCurrentBuild" type="button">현재 빌드 공유 링크 복사</button>
      </div>
      <p id="buildSyncStatus" class="build-sync-status"></p>
      <div id="sharedBuildView" class="shared-build-view"></div>
      <div id="buildList" class="build-list"></div>
    </section>
  </main>

  <div id="essencePickerModal" class="essence-picker-modal" hidden>
    <section class="essence-picker-dialog" role="dialog" aria-modal="true" aria-labelledby="essencePickerTitle">
      <div class="essence-picker-head">
        <div>
          <strong id="essencePickerTitle">정수 선택</strong>
          <span>검색하거나 층/구역으로 좁혀서 선택하세요.</span>
        </div>
        <button id="essencePickerClose" type="button" aria-label="닫기">×</button>
      </div>
      <div class="essence-picker-controls">
        <label class="field">
          <span>검색</span>
          <input id="essencePickerSearch" type="search" placeholder="몬스터, 스탯, 패시브 검색">
        </label>
        <label class="field">
          <span>층</span>
          <select id="essencePickerFloor"></select>
        </label>
        <label class="field">
          <span>구역</span>
          <select id="essencePickerArea"></select>
        </label>
      </div>
      <div id="essencePickerTable" class="essence-picker-table"></div>
    </section>
  </div>

  <script src="./ghost-data.js?v=20260520"></script>
  <script>
    window.DUKHUBUSTERS_CONFIG = window.DUKHUBUSTERS_CONFIG || {
      supabaseUrl: "",
      supabaseAnonKey: "",
      buildTable: "builds",
      reportTable: "monster_reports",
      visitorTable: "site_visitors",
      dailyVisitorTable: "daily_visitors",
    };
  </script>
  <script src="./config.js?v=20260522-5"></script>
  <script src="./app.js?v=20260522-5"></script>
</body>
</html>
